name: Check Upstream Releases (Caddy & Sablier Plugin)

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check Upstream Caddy and Sablier Plugin Releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, os, subprocess, urllib.request

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)

          def commit_if_changed(files, message):
              for f in files:
                  subprocess.run(["git", "add", f], check=True)
              status = subprocess.check_output(["git", "status", "--porcelain"]).decode().strip()
              if status:
                  subprocess.run(["git", "commit", "-m", message], check=True)
                  return True
              return False

          gh_token = os.environ.get("GH_TOKEN", "")
          headers = {"User-Agent": "Python"}
          if gh_token:
              headers["Authorization"] = f"Bearer {gh_token}"

          def get_latest_release(repo):
              url = f"https://api.github.com/repos/{repo}/releases/latest"
              req = urllib.request.Request(url, headers=headers)
              try:
                  data = json.loads(urllib.request.urlopen(req).read().decode())
                  return data.get("tag_name", "")
              except Exception as e:
                  print(f"Error fetching {repo}: {e}")
                  return ""

          # 1. Check Caddy (caddyserver/caddy)
          curr_caddy = ""
          if os.path.exists(".caddy-version"):
              with open(".caddy-version") as f:
                  curr_caddy = f.read().strip()

          latest_caddy = get_latest_release("caddyserver/caddy")
          print(f"Current Caddy: {curr_caddy} | Upstream Caddy: {latest_caddy}")
          caddy_updated = False
          if latest_caddy and latest_caddy != curr_caddy:
              print(f"New Caddy release detected: {latest_caddy}! Updating...")
              with open(".caddy-version", "w") as f:
                  f.write(latest_caddy + "\n")
              commit_if_changed([".caddy-version"], f"ci(caddy): bump upstream Caddy to {latest_caddy}")
              caddy_updated = True

          # 2. Check Sablier Caddy Plugin (sablierapp/sablier-caddy-plugin)
          curr_plugin = ""
          if os.path.exists(".sablier-plugin-version"):
              with open(".sablier-plugin-version") as f:
                  curr_plugin = f.read().strip()

          latest_plugin = get_latest_release("sablierapp/sablier-caddy-plugin")
          print(f"Current Sablier Plugin: {curr_plugin} | Upstream Sablier Plugin: {latest_plugin}")
          plugin_updated = False
          if latest_plugin and latest_plugin != curr_plugin:
              print(f"New Sablier Caddy Plugin detected: {latest_plugin}! Updating...")
              with open(".sablier-plugin-version", "w") as f:
                  f.write(latest_plugin + "\n")
              commit_if_changed([".sablier-plugin-version"], f"ci(sablier): bump upstream sablier-caddy-plugin to {latest_plugin}")
              plugin_updated = True

          # 3. Informational: Check Sablier Core Daemon
          latest_core = get_latest_release("sablierapp/sablier")
          print(f"Informational - Upstream Sablier Core Daemon: {latest_core}")

          # Push changes & tags
          diff_origin = subprocess.check_output(["git", "log", "origin/main..HEAD"]).decode().strip()
          if diff_origin:
              existing_tags = subprocess.check_output(["git", "tag"]).decode().splitlines()
              if caddy_updated and latest_caddy not in existing_tags:
                  subprocess.run(["git", "tag", "-a", latest_caddy, "-m", f"Release {latest_caddy} (Upstream Caddy)"], check=True)

              subprocess.run(["git", "push", "origin", "main"], check=True)
              if caddy_updated and latest_caddy not in existing_tags:
                  subprocess.run(["git", "push", "origin", latest_caddy], check=True)
          else:
              print("Everything is up to date.")
          EOF
